[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "equipo52_module"
version = "0.0.1"
description = "Actividad semana 5, proyecto MiBici"
authors = [
  { name = "Equipo52" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.12,<3.13"


[tool.ruff]
line-length = 99
src = ["equipo52_module"]
include = ["pyproject.toml", "equipo52_module/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["equipo52_module"]
force-sort-within-sections = true

