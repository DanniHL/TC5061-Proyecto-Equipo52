# Pipeline de CI/CD del proyecto MiBici (Equipo 52).
# Se ejecuta en cada push y en cada pull request a main, en tres etapas:
#   1. pruebas:  las cuatro suites de tests/ corren en paralelo en Python 3.12.
#   2. imagen:   se construye la imagen de la API con caché de capas; en push a
#                main también se publica en GHCR.
#   3. compose:  se levanta el sistema con docker compose y se verifica que la
#                API responda una predicción real.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write # solo se usa al publicar la imagen en GHCR (push a main)

# Si llega otro commit a la misma rama o PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # si una suite falla, las demás terminan para ver el panorama completo
      matrix:
        suite: [unitarias, reproducibilidad, seguridad, datos]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip # reutiliza las dependencias instaladas entre corridas
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # tests/datos sale en skipped en CI: DeepChecks necesita el entorno aparte
      # .venv-calidad y los CSV reales, que por política del proyecto no se versionan.
      - name: Ejecutar suite ${{ matrix.suite }}
        run: python -m pytest "tests/${{ matrix.suite }}" -q

  imagen:
    name: Imagen de la API
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR (solo push a main)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # cache-from/to type=gha guarda las capas en el caché de Actions: las
      # corridas siguientes solo reconstruyen lo que cambió. En los PR la imagen
      # se carga al daemon (load) para probarla; en push a main se publica en GHCR.
      # Todas las etiquetas llevan prefijo de registro: si alguna quedara sin él,
      # el push intentaría subirla a Docker Hub y fallaría por falta de login.
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/dannihl/mibici-equipo52-api:latest
            ghcr.io/dannihl/mibici-equipo52-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Probar la imagen construida
        run: |
          docker run -d --name api-ci -p 8000:8000 ghcr.io/dannihl/mibici-equipo52-api:${{ github.sha }}
          for i in $(seq 1 24); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 5
          done
          docker logs api-ci
          exit 1

  compose:
    name: Levantamiento con Compose
    runs-on: ubuntu-latest
    needs: imagen
    steps:
      - uses: actions/checkout@v4

      # mlflow.db está en .gitignore: en CI se crea vacío y el servidor de
      # MLflow genera su esquema al arrancar.
      - name: Preparar la base de MLflow
        run: touch mlflow.db

      - name: Levantar el sistema
        run: docker compose up -d --build

      - name: Esperar a que ambos servicios estén healthy
        run: |
          for servicio in mibici-api mibici-mlflow; do
            timeout 180 bash -c \
              "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' $servicio 2>/dev/null)\" = 'healthy' ]; do sleep 5; done"
          done

      - name: Verificar que la API predice
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/p1/predict \
            -H "Content-Type: application/json" \
            -d '{"estacion_id": 123, "fecha_ultimo_dato": "2026-11-20",
                 "viajes_ultimos_7_dias": [18, 22, 20, 25, 19, 24, 21]}'

      - name: Detener el sistema
        if: always()
        run: docker compose down -v
